<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Raporty" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
  <title>Raporty komputerów</title>
  <style>
    :root{--bg:#f4f6fb;--card:#fff;--ink:#12182a;--muted:#687088;--line:#e6e9f2;--accent:#275efe;--accent2:#1f4ed5;--danger:#d72828;--good:#13a465;--shadow:0 10px 30px rgba(26,39,75,.08);--r:18px}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,Roboto,Arial,sans-serif}
    body{min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    .app{max-width:760px;margin:0 auto;padding:16px}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(244,246,251,.98),rgba(244,246,251,.9));backdrop-filter:blur(16px);padding:8px 0 12px}
    .brand{display:flex;align-items:center;gap:12px;margin:4px 2px 14px}.logo{width:44px;height:44px;border-radius:14px;background:#0b1020;color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:var(--shadow)}
    h1{font-size:25px;line-height:1.1;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
    .btn{border:0;border-radius:14px;padding:13px 15px;font-weight:760;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;background:#e9edf8;color:var(--ink)}
    .btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(39,94,254,.25)}.btn.primary:active{background:var(--accent2)}.btn.dark{background:#0b1020;color:white}.btn.ghost{background:white;border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:#b91c1c;border:1px solid #ffd2d2}.btn.small{min-height:38px;padding:9px 11px;border-radius:12px;font-size:13px}
    .search{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:white;padding:0 14px;font-size:16px;outline:none;box-shadow:0 3px 12px rgba(20,33,65,.03)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}.report-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.check{width:22px;height:22px;accent-color:var(--accent)}
    .report-no{font-size:18px;font-weight:850}.report-model{font-size:14px;color:var(--muted);margin-top:2px}.report-date{font-size:11px;color:#9299aa;margin-top:5px}.chev{font-size:24px;color:#9aa1b3}
    .empty{text-align:center;padding:42px 18px;color:var(--muted)}.empty .emoji{font-size:42px;margin-bottom:10px}.batch{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:15;background:#0b1020;color:white;border-radius:16px;padding:12px;display:none;box-shadow:0 14px 34px rgba(8,14,32,.25);margin-top:12px}.batch.show{display:flex}
    .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#81899d;font-weight:800;margin:18px 2px 8px}.field{margin:12px 0}.label{display:block;font-size:13px;color:#61697d;font-weight:750;margin:0 0 7px 2px}
    .input,.textarea,.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;outline:none;min-height:50px}.textarea{min-height:100px;resize:vertical}.input:focus,.textarea:focus,.select:focus{border-color:#92adff;box-shadow:0 0 0 4px rgba(39,94,254,.1)}
    .chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:750;min-width:64px}.chip.active{background:#e9efff;border-color:#90a9ff;color:#1743bf}.chip.state.active{background:#e9fff4;border-color:#81dcb0;color:#087747}
    .notice{font-size:12px;color:var(--muted);margin:7px 2px 0}.warn-preview{border-left:4px solid var(--danger);padding:10px 12px;background:#fff4f4;border-radius:10px;color:var(--danger);font-weight:800;white-space:pre-wrap}
    .photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eef1f7}.photo-meta{padding:9px}.photo-title{font-size:12px;font-weight:800;display:flex;justify-content:space-between;gap:6px}.photo-actions{display:flex;gap:6px;margin-top:7px}.photo-actions button{flex:1;border:0;background:#eef2fb;border-radius:9px;padding:8px 4px;font-size:12px}.export-toggle{display:flex;align-items:center;gap:7px;font-size:12px;margin-top:8px;color:#4e566b}.export-toggle input{width:18px;height:18px;accent-color:var(--accent)}
    .photo-add{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.file-input{display:none}.editor-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}.back{width:44px;height:44px;border:0;border-radius:14px;background:white;border:1px solid var(--line);font-size:22px}.editor-title{font-weight:850;font-size:20px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.save-dot{font-size:12px;color:var(--good);font-weight:750;margin-left:auto}
    .sticky-actions{position:sticky;bottom:0;z-index:15;margin:18px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,246,251,.25),rgba(244,246,251,.98) 30%);backdrop-filter:blur(12px)}.sticky-actions .btn{flex:1}
    .install{background:#0b1020;color:#fff;border-radius:16px;padding:14px;margin:10px 0 14px;display:none}.install.show{display:block}.install-title{font-weight:850}.install-txt{font-size:13px;opacity:.8;margin-top:3px;line-height:1.35}
    .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(15px);background:#111827;color:#fff;border-radius:13px;padding:11px 14px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:88%;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.22)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .modal{position:fixed;inset:0;background:rgba(5,10,24,.54);display:none;align-items:flex-end;z-index:80}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}.sheet h2{margin:2px 0 10px}.sheet p{color:var(--muted);line-height:1.45}
    .loading{position:fixed;inset:0;background:rgba(255,255,255,.72);backdrop-filter:blur(5px);display:none;place-items:center;z-index:120}.loading.show{display:grid}.spinner{width:44px;height:44px;border:4px solid #dce3f7;border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}.mt8{margin-top:8px}.mt12{margin-top:12px}.divider{height:1px;background:var(--line);margin:14px 0}
    .folder-card{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px}.folder-icon{width:52px;height:52px;border-radius:15px;background:#eef2ff;display:grid;place-items:center;font-size:25px}.folder-name{font-size:18px;font-weight:850}.folder-meta{font-size:12px;color:var(--muted);margin-top:3px}.folder-tools{display:flex;gap:6px}.folder-tools button{border:0;background:#eef2f8;border-radius:10px;min-width:38px;height:38px}
    .crop-sheet{height:min(88vh,760px);display:flex;flex-direction:column}.crop-area{flex:1;min-height:0;background:#111827;border-radius:14px;overflow:hidden;margin:10px 0}.crop-area img{display:block;max-width:100%}.crop-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.crop-actions .btn{padding:10px 8px;min-height:42px}
    .pdf-render-root{position:fixed;left:-10000px;top:0;width:794px;z-index:-1;pointer-events:none}.pdf-page{width:794px;height:1123px;background:white;color:#171c2a;padding:64px 70px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}.pdf-inner{height:100%;display:flex;flex-direction:column}.pdf-info{flex:0 0 auto}.pdf-title{font-size:31px;line-height:1.18;font-weight:800;margin:0 0 24px}.pdf-spec{font-size:17px;line-height:1.55;margin:0 0 4px}.pdf-notes{font-size:25px;line-height:1.2;font-weight:800;color:#d62828;margin:18px 0 20px;white-space:pre-wrap;overflow-wrap:anywhere}.pdf-state{display:grid;grid-template-columns:max-content 1fr;gap:12px;font-size:16px;line-height:1.38;margin:0 0 22px}.pdf-state b{font-weight:800}.pdf-state div{white-space:pre-wrap;overflow-wrap:anywhere}.pdf-photo-slot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.pdf-photo-slot img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.pdf-photo-page{height:100%;display:flex;flex-direction:column;gap:28px}.pdf-photo-page .pdf-photo-slot{flex:1}
    @media(min-width:700px){.photos{grid-template-columns:repeat(3,1fr)}.app{padding:22px}.sticky-actions{margin-left:-22px;margin-right:-22px;margin-bottom:-22px;padding-left:22px;padding-right:22px}}
  </style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<div id="loading" class="loading"><div class="spinner"></div></div>
<div id="installModal" class="modal" onclick="if(event.target===this) closeInstall()"><div class="sheet"><h2>Dodaj aplikację na ekran główny</h2><p>Na iPhonie otwórz tę stronę w <b>Safari</b>, stuknij ikonę <b>Udostępnij</b> (kwadrat ze strzałką) i wybierz <b>Dodaj do ekranu początkowego</b>.</p><button class="btn primary" style="width:100%" onclick="closeInstall()">OK</button></div></div>
<div id="cropModal" class="modal"><div class="sheet crop-sheet"><h2>Kadruj zdjęcie</h2><div class="crop-area"><img id="cropImage" alt="Kadrowanie"></div><div class="crop-actions"><button class="btn ghost" onclick="rotateCrop(-90)">↺ Obróć</button><button class="btn ghost" onclick="resetCrop()">Reset</button><button class="btn ghost" onclick="rotateCrop(90)">Obróć ↻</button></div><div class="row mt12"><button class="btn ghost grow" onclick="closeCrop()">Anuluj</button><button class="btn primary grow" onclick="saveCrop()">Zapisz kadr</button></div></div></div>
<div id="shareReadyModal" class="modal" onclick="if(event.target===this)closePreparedShare()"><div class="sheet"><h2 id="shareReadyTitle">Plik gotowy</h2><p id="shareReadyText">Plik został przygotowany. Stuknij przycisk poniżej, żeby otworzyć systemowe udostępnianie iPhone’a.</p><div class="row"><button class="btn ghost grow" onclick="closePreparedShare()">Anuluj</button><button class="btn primary grow" onclick="performPreparedShare()">↗️ Udostępnij</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script>
const DB_NAME='kompRaportDB_v2', DB_VER=1, DATA_STORE='items', LEGACY_DB='kompRaportDB', UNFILED='__unfiled__';
let db=null, reports=[], folders=[], selected=new Set(), current=null, currentFolderKey=null, saveTimer=null, cropper=null, cropIndex=-1, preparedShare=null;
const $=s=>document.querySelector(s), esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200)}
function loading(on){$('#loading').classList.toggle('show',!!on)}
function uuid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2))}
function nowISO(){return new Date().toISOString()}
function fmtDate(s){try{return new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(s))}catch{return ''}}
function safeName(s){return (s||'raport').trim().replace(/[\\/:*?"<>|]/g,'_')||'raport'}

function openDB(){
 return new Promise((res,rej)=>{
   const r=indexedDB.open(DB_NAME,DB_VER);
   r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(DATA_STORE))d.createObjectStore(DATA_STORE,{keyPath:'id'})};
   r.onsuccess=()=>{db=r.result;res(db)};
   r.onerror=()=>rej(r.error||new Error('Nie można otworzyć bazy danych'));
   r.onblocked=()=>rej(new Error('Baza danych jest zablokowana przez inną kartę aplikacji'));
 });
}
function dataStore(mode='readonly'){return db.transaction(DATA_STORE,mode).objectStore(DATA_STORE)}
function getAllData(){return new Promise((res,rej)=>{const r=dataStore().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function dataPut(obj){return new Promise((res,rej)=>{const r=dataStore('readwrite').put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function dataDel(id){return new Promise((res,rej)=>{const r=dataStore('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

async function dbAll(){const all=await getAllData();return all.filter(x=>x&&x.kind!=='folder').map(x=>({...x,kind:'report'}))}
function dbPut(obj){return dataPut({...obj,kind:'report'})}
function dbDel(id){return dataDel(id)}
async function dbFolders(){const all=await getAllData();return all.filter(x=>x&&x.kind==='folder')}
function dbFolderPut(obj){return dataPut({...obj,kind:'folder'})}
function dbFolderDel(id){return dataDel(id)}

function legacyGetAll(database,storeName){
 return new Promise((res,rej)=>{
   try{
     if(!database.objectStoreNames.contains(storeName)){res([]);return}
     const tr=database.transaction(storeName,'readonly');
     const q=tr.objectStore(storeName).getAll();
     q.onsuccess=()=>res(q.result||[]);
     q.onerror=()=>rej(q.error);
   }catch(e){rej(e)}
 });
}
async function migrateLegacyIfNeeded(){
 const existing=await getAllData();
 if(existing.length) return;
 await new Promise(resolve=>{
   let req;
   try{req=indexedDB.open(LEGACY_DB)}catch{resolve();return}
   req.onerror=()=>resolve();
   req.onblocked=()=>resolve();
   req.onsuccess=async()=>{
     const old=req.result;
     try{
       let oldReports=[], oldFolders=[];
       if(old.objectStoreNames.contains('reports')){
         const raw=await legacyGetAll(old,'reports');
         oldReports=raw.filter(x=>x&&x.kind!=='folder');
         oldFolders.push(...raw.filter(x=>x&&x.kind==='folder'));
       }
       if(old.objectStoreNames.contains('folders')){
         oldFolders.push(...await legacyGetAll(old,'folders'));
       }
       const folderMap=new Map();
       for(const folder of oldFolders){if(folder&&folder.id)folderMap.set(folder.id,{...folder,kind:'folder'})}
       for(const report of oldReports){if(report&&report.id)await dataPut({...report,kind:'report'})}
       for(const folder of folderMap.values())await dataPut(folder);
     }catch(e){console.warn('Legacy migration skipped',e)}
     try{old.close()}catch{}
     resolve();
   };
 });
}
function activeFolderId(){return currentFolderKey===UNFILED?null:currentFolderKey}
function newReport(){return {id:uuid(),folderId:activeFolderId(),computerNo:'',model:'',cpu:'',ram:'8',ramOther:'',disk:'256',diskOther:'',os:'Windows 10 Pro',osOther:'',notes:'',condition:'Dobry',conditionDesc:'',photos:[],createdAt:nowISO(),updatedAt:nowISO()}}
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function home(){current=null;currentFolderKey=null;selected.clear();window._search='';renderHome()}
function renderHome(){
 const install=!isStandalone();
 const sorted=[...folders].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
 const unfiled=reports.filter(r=>!r.folderId).length;
 $('#app').innerHTML=`<div class="topbar"><div class="brand"><div class="logo">R</div><div><h1>Foldery</h1><div class="sub">Każdy bazarek osobno</div></div></div>
 <button class="btn primary" style="width:100%" onclick="createFolder()">＋ Nowy folder</button>
 ${install?`<div class="install show" onclick="showInstall()"><div class="install-title">📱 Zainstaluj na iPhonie</div><div class="install-txt">Dodaj do ekranu początkowego, żeby działała jak zwykła aplikacja.</div></div>`:''}</div>
 ${sorted.map(f=>{const count=reports.filter(r=>r.folderId===f.id).length;return `<div class="card folder-card" onclick="openFolder('${f.id}')"><div class="folder-icon">📁</div><div><div class="folder-name">${esc(f.name)}</div><div class="folder-meta">${count} ${count===1?'komputer':'komputerów'} • ${fmtDate(f.createdAt)}</div></div><div class="folder-tools"><button onclick="event.stopPropagation();renameFolder('${f.id}')">✎</button></div></div>`}).join('')}
 ${unfiled?`<div class="card folder-card" onclick="openFolder(UNFILED)"><div class="folder-icon">📂</div><div><div class="folder-name">Bez folderu</div><div class="folder-meta">${unfiled} starszych raportów</div></div><div class="chev">›</div></div>`:''}
 ${!sorted.length&&!unfiled?`<div class="card empty"><div class="emoji">📁</div><b>Brak folderów</b><div class="mt8">Utwórz folder np. „Bazarek 21.09” i dopiero w nim dodawaj komputery.</div></div>`:''}`;
}
async function createFolder(){const name=prompt('Nazwa folderu, np. Bazarek 21.09');if(!name||!name.trim())return;const f={id:uuid(),name:name.trim(),createdAt:nowISO()};await dbFolderPut(f);folders.unshift(f);openFolder(f.id)}
async function renameFolder(id){const f=folders.find(x=>x.id===id);if(!f)return;const name=prompt('Nowa nazwa folderu',f.name);if(!name||!name.trim())return;f.name=name.trim();await dbFolderPut(f);renderHome()}
async function deleteCurrentFolder(){if(currentFolderKey===UNFILED)return;const count=reports.filter(r=>r.folderId===currentFolderKey).length;if(count){alert('Folder nie jest pusty. Najpierw usuń lub przenieś znajdujące się w nim raporty.');return}if(!confirm('Usunąć pusty folder?'))return;await dbFolderDel(currentFolderKey);folders=folders.filter(f=>f.id!==currentFolderKey);home()}
function openFolder(id){currentFolderKey=id;selected.clear();window._search='';renderFolder()}
function folderName(){if(currentFolderKey===UNFILED)return 'Bez folderu';return folders.find(f=>f.id===currentFolderKey)?.name||'Folder'}
function renderFolder(){
 const q=(window._search||'').toLowerCase();
 const items=reports.filter(r=>(currentFolderKey===UNFILED?!r.folderId:r.folderId===currentFolderKey)).filter(r=>(r.computerNo+' '+r.model).toLowerCase().includes(q)).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
 $('#app').innerHTML=`<div class="topbar"><div class="editor-head"><button class="back" onclick="home()">‹</button><div><div class="editor-title">${esc(folderName())}</div><div class="sub">${items.length} raportów</div></div></div>
 <button class="btn primary" style="width:100%" onclick="editNew()">＋ Nowy komputer</button>
 <input class="search mt12" placeholder="Szukaj po numerze lub modelu…" value="${esc(window._search||'')}" oninput="window._search=this.value;renderFolder()"></div>
 ${items.length?items.map(r=>`<div class="card report-card"><input class="check" type="checkbox" ${selected.has(r.id)?'checked':''} onchange="toggleSel('${r.id}',this.checked)"><div onclick="openReport('${r.id}')"><div class="report-no">${esc(r.computerNo||'Bez numeru')}</div><div class="report-model">${esc(r.model||'Bez modelu')}</div><div class="report-date">${fmtDate(r.updatedAt)}</div></div><div class="chev" onclick="openReport('${r.id}')">›</div></div>`).join(''):`<div class="card empty"><div class="emoji">💻</div><b>Brak komputerów w tym folderze</b><div class="mt8">Dodaj pierwszy raport.</div></div>`}
 ${currentFolderKey!==UNFILED&&items.length===0?`<button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteCurrentFolder()">Usuń pusty folder</button>`:''}
 <div class="batch ${selected.size?'show':''}"><div class="grow"><b>${selected.size} zazn.</b><div style="font-size:12px;opacity:.75">PDF-y + wybrane zdjęcia</div></div><button class="btn primary small" onclick="exportBatch()">Utwórz ZIP</button></div>`;
}
function toggleSel(id,on){on?selected.add(id):selected.delete(id);renderFolder()}
async function editNew(){if(currentFolderKey===null){alert('Najpierw otwórz lub utwórz folder.');return}current=newReport();await dbPut(current);reports.unshift(current);renderEditor()}
function openReport(id){current=JSON.parse(JSON.stringify(reports.find(r=>r.id===id)));currentFolderKey=current.folderId||UNFILED;renderEditor()}
function renderEditor(){
 const r=current;
 $('#app').innerHTML=`<div class="editor-head"><button class="back" onclick="saveAndFolder()">‹</button><div class="editor-title">${esc(r.computerNo||'Nowy komputer')}</div><div class="save-dot">● zapis automatyczny</div></div>
 <div class="section-title">Identyfikacja</div><div class="card">
 ${field('Nazwa kompa / numer','computerNo',r.computerNo,'np. 06543','numeric')}
 ${field('Model','model',r.model,'np. HP EliteBook 840 G4')}
 ${field('Procesor','cpu',r.cpu,'np. Intel i5-7200U')}
 </div>
 <div class="section-title">Specyfikacja</div><div class="card">
 <div class="field"><span class="label">RAM</span><div class="chips">${['8','16','24','32'].map(v=>chip(v+' GB',r.ram===v,`setChoice('ram','${v}')`)).join('')}${chip('Inne',r.ram==='other',`setChoice('ram','other')`)}</div>${r.ram==='other'?field('', 'ramOther', r.ramOther,'Wpisz np. 64','numeric'):''}</div>
 <div class="field"><span class="label">Dysk</span><div class="chips">${['256','512'].map(v=>chip(v+' GB',r.disk===v,`setChoice('disk','${v}')`)).join('')}${chip('Inny',r.disk==='other',`setChoice('disk','other')`)}</div>${r.disk==='other'?field('', 'diskOther', r.diskOther,'Wpisz pojemność w GB','numeric'):''}</div>
 <div class="field"><span class="label">System operacyjny</span><div class="chips">${['Windows 10 Pro','Windows 11 Pro'].map(v=>chip(v,r.os===v,`setChoice('os','${v}')`)).join('')}${chip('Inny',r.os==='other',`setChoice('os','other')`)}</div>${r.os==='other'?field('', 'osOther', r.osOther,'Wpisz system'):''}</div>
 </div>
 <div class="section-title">Stan</div><div class="card">
 <div class="field"><span class="label">Uwagi — w PDF będą duże i czerwone</span><textarea class="textarea" placeholder="np. Laptop sprzedawany jest bez zasilacza." oninput="setVal('notes',this.value)">${esc(r.notes)}</textarea>${r.notes?`<div class="warn-preview mt8">${esc(r.notes)}</div>`:''}</div>
 <div class="field"><span class="label">Stan techniczny</span><div class="chips">${['Średni','Dobry','Bardzo dobry'].map(v=>`<button class="chip state ${r.condition===v?'active':''}" onclick="setChoice('condition','${v}')">${v}</button>`).join('')}</div></div>
 <div class="field"><span class="label">Opis stanu</span><textarea class="textarea" placeholder="np. brak 1 śrubki od obudowy, ryski" oninput="setVal('conditionDesc',this.value)">${esc(r.conditionDesc)}</textarea></div>
 </div>
 <div class="section-title">Zdjęcia (${r.photos.length})</div><div class="card">
 <div class="photos">${r.photos.map((p,i)=>photoCard(p,i)).join('')}</div>
 <div class="photo-add"><label class="btn dark">📷 Zrób zdjęcie<input id="cam" class="file-input" type="file" accept="image/*" capture="environment" onchange="addFiles(this.files);this.value=''" /></label><label class="btn ghost">🖼️ Galeria<input id="gal" class="file-input" type="file" accept="image/*" multiple onchange="addFiles(this.files);this.value=''" /></label></div>
 <div class="notice">Pierwsze zdjęcie trafia na 1. stronę PDF. Kolejne układają się po 2 na stronę. Ostatnie samotne zdjęcie będzie duże na osobnej stronie.</div>
 </div>
 <div class="section-title">Eksport</div><div class="card"><div class="row wrap"><button class="btn ghost grow" onclick="previewPDF()">👁 Podgląd PDF</button><button class="btn primary grow" onclick="sharePDF()">↗️ Udostępnij PDF</button></div><div class="row wrap mt8"><button class="btn ghost grow" onclick="duplicateCurrent()">⧉ Duplikuj</button><button class="btn danger grow" onclick="deleteCurrent()">🗑 Usuń</button></div></div>
 <div class="sticky-actions"><div class="row"><button class="btn dark" onclick="saveAndFolder()">✓ Zapisz i wróć</button></div></div>`;
}
function field(label,key,val,ph='',type='text'){return `<div class="field">${label?`<label class="label">${label}</label>`:''}<input class="input" type="${type}" inputmode="${type==='numeric'?'numeric':'text'}" value="${esc(val)}" placeholder="${esc(ph)}" oninput="setVal('${key}',this.value)" /></div>`}
function chip(txt,on,click){return `<button class="chip ${on?'active':''}" onclick="${click}">${txt}</button>`}
function photoCard(p,i){return `<div class="photo"><img src="${p.dataUrl}" alt="Zdjęcie ${i+1}"><div class="photo-meta"><div class="photo-title"><span>${i===0?'Główne':'Zdjęcie '+(i+1)}</span><span>${Math.round((p.size||0)/1024)} KB</span></div><div class="photo-actions"><button onclick="cropPhoto(${i})">Kadruj</button><button onclick="movePhoto(${i},-1)" ${i===0?'disabled':''}>↑</button><button onclick="movePhoto(${i},1)" ${i===current.photos.length-1?'disabled':''}>↓</button><button onclick="removePhoto(${i})">Usuń</button></div><label class="export-toggle"><input type="checkbox" ${p.export?'checked':''} onchange="togglePhotoExport(${i},this.checked)"> Eksportuj osobno (~40 KB JPG)</label></div></div>`}
function setVal(k,v){current[k]=v;current.updatedAt=nowISO();scheduleSave();if(k==='computerNo')$('.editor-title').textContent=v||'Nowy komputer'}
function setChoice(k,v){current[k]=v;current.updatedAt=nowISO();scheduleSave();renderEditor()}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveCurrent,300)}
async function saveCurrent(){if(!current)return;await dbPut(current);const i=reports.findIndex(x=>x.id===current.id);if(i>=0)reports[i]=JSON.parse(JSON.stringify(current));else reports.unshift(JSON.parse(JSON.stringify(current)))}
async function saveAndFolder(){await saveCurrent();current=null;selected.clear();renderFolder()}
async function duplicateCurrent(){await saveCurrent();const c=JSON.parse(JSON.stringify(current));c.id=uuid();c.computerNo='';c.createdAt=c.updatedAt=nowISO();c.photos=c.photos.map(p=>({...p,id:uuid()}));await dbPut(c);reports.unshift(c);current=c;toast('Utworzono kopię');renderEditor()}
async function deleteCurrent(){if(!confirm('Usunąć ten raport?'))return;await dbDel(current.id);reports=reports.filter(x=>x.id!==current.id);selected.delete(current.id);current=null;renderFolder()}
function movePhoto(i,d){const j=i+d;if(j<0||j>=current.photos.length)return;[current.photos[i],current.photos[j]]=[current.photos[j],current.photos[i]];scheduleSave();renderEditor()}
function removePhoto(i){current.photos.splice(i,1);scheduleSave();renderEditor()}
function togglePhotoExport(i,on){current.photos[i].export=on;scheduleSave()}
function cropPhoto(i){if(!window.Cropper){alert('Narzędzie kadrowania nie załadowało się. Połącz się z internetem i odśwież aplikację raz.');return}cropIndex=i;const modal=$('#cropModal'),img=$('#cropImage');img.src=current.photos[i].dataUrl;modal.classList.add('show');setTimeout(()=>{if(cropper)cropper.destroy();cropper=new Cropper(img,{viewMode:1,dragMode:'move',autoCropArea:1,background:false,responsive:true,rotatable:true,scalable:false,zoomOnWheel:true,zoomOnTouch:true})},60)}
function rotateCrop(deg){if(cropper)cropper.rotate(deg)}
function resetCrop(){if(cropper)cropper.reset()}
function closeCrop(){if(cropper){cropper.destroy();cropper=null}cropIndex=-1;$('#cropModal').classList.remove('show')}
async function saveCrop(){if(!cropper||cropIndex<0)return;loading(true);try{const canvas=cropper.getCroppedCanvas({maxWidth:1900,maxHeight:1900,imageSmoothingEnabled:true,imageSmoothingQuality:'high',fillColor:'#fff'});const dataUrl=canvas.toDataURL('image/jpeg',.9);const p=current.photos[cropIndex];p.dataUrl=dataUrl;p.width=canvas.width;p.height=canvas.height;p.size=Math.round((dataUrl.length-22)*3/4);current.updatedAt=nowISO();await saveCurrent();closeCrop();renderEditor();toast('Kadr zapisany')}catch(e){alert('Nie udało się zapisać kadru: '+e.message)}finally{loading(false)}}
async function addFiles(fileList){const files=[...fileList];if(!files.length)return;loading(true);try{for(const f of files){const p=await imageToJpeg(f,1900,.86);current.photos.push({id:uuid(),dataUrl:p.dataUrl,width:p.width,height:p.height,size:p.size,export:false,name:f.name||'photo'})}current.updatedAt=nowISO();await saveCurrent();renderEditor();toast(`Dodano ${files.length} zdjęć`)}catch(e){console.error(e);alert('Nie udało się dodać zdjęcia: '+e.message)}finally{loading(false)}}
function imageToJpeg(file,maxDim=1900,quality=.86){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('Nie można odczytać pliku'));fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('Format zdjęcia nie jest obsługiwany'));img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const scale=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);const dataUrl=c.toDataURL('image/jpeg',quality);res({dataUrl,width:w,height:h,size:Math.round((dataUrl.length-22)*3/4)})};img.src=fr.result};fr.readAsDataURL(file)})}
function requirePDF(){if(!window.jspdf||!window.html2canvas){alert('Generator PDF nie załadował się. Połącz się z internetem i odśwież aplikację raz.');return false}return true}
function pdfSpecs(report){const out=[];if(report.cpu)out.push(['Procesor',report.cpu]);const ram=report.ram==='other'?report.ramOther:report.ram;if(ram)out.push(['Pamięć RAM',ram+' GB RAM']);const disk=report.disk==='other'?report.diskOther:report.disk;if(disk)out.push(['Dysk SSD',disk+' GB']);const os=report.os==='other'?report.osOther:report.os;if(os)out.push(['System operacyjny',os]);return out}
function buildPdfPages(report){
 const root=document.createElement('div');root.className='pdf-render-root';
 const p1=document.createElement('div');p1.className='pdf-page';
 const state=[report.condition,report.conditionDesc].filter(Boolean).join(', ');
 p1.innerHTML=`<div class="pdf-inner"><div class="pdf-info"><div class="pdf-title">${esc(report.model||'Komputer')}:</div>${pdfSpecs(report).map(([a,b])=>`<div class="pdf-spec">• ${esc(a)}: ${esc(b)}</div>`).join('')}${report.notes?`<div class="pdf-notes">${esc(report.notes)}</div>`:''}<div class="pdf-state"><b>Stan techniczny:</b><div>${esc(state)}</div></div></div>${report.photos[0]?`<div class="pdf-photo-slot"><img src="${report.photos[0].dataUrl}"></div>`:''}</div>`;
 root.appendChild(p1);
 const rest=report.photos.slice(1);for(let i=0;i<rest.length;i+=2){const page=document.createElement('div');page.className='pdf-page';const pair=rest.slice(i,i+2);page.innerHTML=`<div class="pdf-photo-page">${pair.map(p=>`<div class="pdf-photo-slot"><img src="${p.dataUrl}"></div>`).join('')}</div>`;root.appendChild(page)}
 return root
}
async function waitImages(root){const imgs=[...root.querySelectorAll('img')];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=res;img.onerror=res})))}
async function makePdf(report){if(!requirePDF())throw new Error('Brak generatora PDF');const {jsPDF}=window.jspdf;const root=buildPdfPages(report);document.body.appendChild(root);try{await waitImages(root);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const pages=[...root.querySelectorAll('.pdf-page')];const doc=new jsPDF({unit:'mm',format:'a4',compress:true});for(let i=0;i<pages.length;i++){const canvas=await html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true,allowTaint:true});const img=canvas.toDataURL('image/jpeg',.94);if(i>0)doc.addPage();doc.addImage(img,'JPEG',0,0,210,297,undefined,'FAST')}return doc.output('blob')}finally{root.remove()}}
async function previewPDF(){loading(true);try{await saveCurrent();const b=await makePdf(current);const u=URL.createObjectURL(b);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){alert(e.message)}finally{loading(false)}}
function downloadBlob(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function prepareShare(blob,name,title='Raport',description='Plik został przygotowany. Stuknij Udostępnij, aby otworzyć systemowe menu iPhone’a.'){preparedShare={blob,name,title};$('#shareReadyTitle').textContent=title||'Plik gotowy';$('#shareReadyText').textContent=description;$('#shareReadyModal').classList.add('show')}
function closePreparedShare(){$('#shareReadyModal').classList.remove('show');preparedShare=null}
function performPreparedShare(){
 if(!preparedShare)return;
 const {blob,name,title}=preparedShare;
 const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
   navigator.share({files:[file],title}).then(()=>closePreparedShare()).catch(e=>{
     if(e&&e.name==='AbortError')return;
     console.warn('share failed, using download fallback',e);
     downloadBlob(blob,name);
     closePreparedShare();
     toast('Zapisano plik — możesz wysłać go z aplikacji Pliki');
   });
 }else{
   downloadBlob(blob,name);
   closePreparedShare();
   toast('Zapisano plik — możesz wysłać go z aplikacji Pliki');
 }
}
async function sharePDF(){loading(true);try{await saveCurrent();if(!current.computerNo){alert('Najpierw wpisz Nazwę kompa / numer, np. 06543.');return}const b=await makePdf(current);prepareShare(b,safeName(current.computerNo)+'.pdf','Raport '+current.computerNo,'PDF jest gotowy. Stuknij Udostępnij, żeby wysłać go przez Mail, Gmail, AirDrop lub zapisać w Plikach.')}catch(e){if(e.name!=='AbortError')alert('Nie udało się przygotować PDF: '+e.message)}finally{loading(false)}}
function tinyJpegBlob(p,targetBytes=40000){return new Promise((res,rej)=>{const img=new Image();img.onerror=()=>rej(new Error('Nie udało się przygotować miniatury'));img.onload=async()=>{try{let maxDim=900;let scale=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));let w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));const makeCanvas=()=>{const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);return canvas};const toBlob=(canvas,q)=>new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Błąd kompresji zdjęcia')),'image/jpeg',q));let canvas=makeCanvas();let lo=.18,hi=.82,best=null;for(let i=0;i<7;i++){const q=(lo+hi)/2;const b=await toBlob(canvas,q);if(b.size<=targetBytes){best=b;lo=q}else{hi=q}}if(!best)best=await toBlob(canvas,.16);let rounds=0;while(best.size>targetBytes&&rounds<6){w=Math.max(320,Math.round(w*.82));h=Math.max(240,Math.round(h*.82));canvas=makeCanvas();best=await toBlob(canvas,.16);rounds++}res(best)}catch(e){rej(e)}};img.src=p.dataUrl})}
async function exportBatch(){if(!selected.size)return;if(!window.JSZip){alert('Generator ZIP nie załadował się. Połącz się z internetem i odśwież aplikację raz.');return}loading(true);try{const zip=new JSZip();const picked=reports.filter(r=>selected.has(r.id));for(const r of picked){const base=safeName(r.computerNo||r.model||'raport');const pdf=await makePdf(r);zip.file(base+'.pdf',pdf);const imgs=r.photos.filter(p=>p.export);for(let i=0;i<imgs.length;i++){const jpg=await tinyJpegBlob(imgs[i],40000);const name=imgs.length===1?`${base}.jpg`:`${base}_${i+1}.jpg`;zip.file(name,jpg)}}const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:5}});const d=new Date();const ds=`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;prepareShare(blob,`Raporty_${ds}.zip`,'Paczka raportów','Paczka ZIP jest gotowa. Zdjęcia oznaczone do osobnego eksportu są mocno zmniejszone i kompresowane do około 40 KB każde. Stuknij Udostępnij.')}catch(e){if(e.name!=='AbortError')alert('Nie udało się utworzyć paczki: '+e.message)}finally{loading(false)}}
function showInstall(){$('#installModal').classList.add('show')}function closeInstall(){$('#installModal').classList.remove('show')}
async function init(){try{$('#app').innerHTML='<div class="card empty"><div class="emoji">⏳</div><b>Uruchamianie aplikacji…</b></div>';await openDB();await migrateLegacyIfNeeded();[reports,folders]=await Promise.all([dbAll(),dbFolders()]);renderHome();if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}catch(e){console.error(e);$('#app').innerHTML='<div class="card empty"><div class="emoji">⚠️</div><b>Nie udało się uruchomić aplikacji</b><div class="mt8">'+esc(e?.message||String(e))+'</div><button class="btn primary mt12" onclick="location.reload()">Odśwież</button></div>'}}
init();
</script>
</body>
